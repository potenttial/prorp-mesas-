<style>
:root{--bg:#333333;--ink:#F5F3EF;--mut:#CFCBC4;--line:#555;--acc:#E46A2B;--deep:#161616}
*{box-sizing:border-box}
html,body{margin:0;background:#262626;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
button,input,label{font-family:inherit}
a{color:var(--acc)}
.app{max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 24px 14px;border-bottom:1px solid #474747;position:sticky;top:0;background:var(--bg);z-index:5}
.wm{font-size:26px;line-height:1;font-weight:500;letter-spacing:-.5px}.wm b{font-weight:500;color:var(--acc)}
.wmline{height:1px;width:116px;background:var(--acc);margin:4px 0}
.wmsub{font-size:6.5px;letter-spacing:.6px;color:var(--mut);line-height:1.4}
.pro{text-align:right}.pro div:first-child{font-size:15px;letter-spacing:2.5px;font-weight:400}.pro div:last-child{font-size:8px;letter-spacing:1.6px;color:var(--mut);margin-top:3px}
main{flex:1;padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
.k{font-size:11px;letter-spacing:2px;color:var(--mut)}
h1{margin:0;font-size:44px;line-height:1.02;font-weight:300;letter-spacing:-1px}
h2{margin:0;font-size:30px;line-height:1.1;font-weight:300}
h1 span,h2 span{color:var(--acc)}
p{margin:0;font-size:15px;line-height:1.5;color:#DAD6CF}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.num{color:var(--acc);font-size:22px;font-weight:400;width:32px;line-height:1;flex-shrink:0}
.btn{min-height:54px;border:0;border-radius:4px;background:var(--acc);color:#fff;font-size:17px;font-weight:400;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;text-decoration:none;width:100%}
.btn:disabled{background:#4a4a4a;color:#9a968f;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn.sm{min-height:46px;font-size:15px}
.link{background:none;border:0;color:var(--mut);font-size:14px;min-height:44px;cursor:pointer;text-decoration:underline}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mut);letter-spacing:.4px}
.in{height:50px;padding:0 14px;border:1px solid #5c5c5c;border-radius:4px;background:#2b2b2b;color:var(--ink);font-size:16px;font-weight:300;width:100%}
.in:focus{outline:2px solid var(--acc);outline-offset:1px}
.consent{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:14px;line-height:1.45;color:#DAD6CF}
.consent input{width:22px;height:22px;margin:0;accent-color:var(--acc);flex-shrink:0}
.pill{font-size:11px;letter-spacing:.6px;padding:4px 8px;border-radius:999px;white-space:nowrap;border:1px solid var(--acc)}
.pill.ok{color:#9FE3C1;border-color:#3f7a5f}
.person{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 14px;border-radius:4px;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink);text-align:left;width:100%}
.person[aria-checked=true]{border-color:var(--acc);background:#3f3a36}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid #8f8c87;flex-shrink:0}
.person[aria-checked=true] .radio{border:6px solid var(--acc)}
.sec{font-size:12px;letter-spacing:1.6px;color:var(--acc);font-weight:400}
.dash{display:flex;gap:10px;font-size:15px;line-height:1.5;color:#E6E2DB}
.net{width:100%;border-radius:6px;background-color:var(--deep);background-image:radial-gradient(rgba(245,243,239,.07) 1px,transparent 1px),radial-gradient(circle at 50% 50%,rgba(228,106,43,.16),rgba(22,22,22,0) 62%);background-size:14px 14px,100% 100%;display:block}
.glow{animation:glow 2.6s ease-in-out infinite}
.hub{animation:pulse 2.4s ease-out infinite;transform-origin:171px 160px}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes pulse{0%{stroke-width:0;stroke-opacity:.6}100%{stroke-width:30;stroke-opacity:0}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));padding:10px;border-radius:6px;background:var(--deep);border:1px solid #3c3c3c}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:#6f6c68;border-radius:3px}
.cell.w{color:var(--acc);font-weight:400}.cell.h{background:var(--acc);color:#fff;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;font-size:12px;letter-spacing:1px;cursor:pointer;background:transparent;color:#E6E2DB;border:1px solid #5c5c5c}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.wa{display:flex;flex-direction:column;gap:10px;padding:14px;background:#2b2b2b;border-radius:6px}
.bubble{align-self:flex-start;max-width:290px;padding:10px 12px;background:#1F4D3A;border-radius:0 8px 8px 8px;font-size:13.5px;line-height:1.45;color:#F2F7F4}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid #6a6a6a;flex-shrink:0}.dot.now{border:2px solid var(--acc)}.dot.done{background:var(--acc);border-color:var(--acc)}
.n3card{display:flex;flex-direction:column;gap:12px;padding:20px;background:#0E0E0E;border-radius:6px}
footer{display:flex;align-items:center;gap:12px;padding:12px 24px 16px;background:#0E0E0E;border-top:1px solid #222}
footer img{width:64px;height:auto;display:block}
footer span{font-size:12px}footer a{font-size:12px;text-decoration:none}
.recbtn{width:128px;height:128px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--acc);box-shadow:0 0 0 12px rgba(228,106,43,.18)}.recbtn.on{background:#C23B22;animation:rp 1.6s ease-out infinite}@keyframes rp{0%{box-shadow:0 0 0 0 rgba(194,59,34,.5)}100%{box-shadow:0 0 0 24px rgba(194,59,34,0)}}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.demo{font-size:11px;letter-spacing:1px;color:#8f8c87;text-align:center;padding:6px;background:#2b2b2b}
.err{padding:12px 14px;border:1px solid #C23B22;border-radius:4px;font-size:14px;line-height:1.45;color:#F5D6CF}
.note{padding:12px 14px;border:1px solid #5c5c5c;border-radius:4px;font-size:13px;line-height:1.45;color:#CFCBC4}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats>div{flex:1;min-width:84px;padding:12px;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:2px}.stats b{font-size:28px;font-weight:300;color:var(--acc)}.stats span{font-size:12px;color:var(--mut)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}.tbl th{text-align:left;font-weight:400;color:var(--mut);letter-spacing:.6px;font-size:11px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:10px 12px;border-bottom:1px solid #444;vertical-align:top}.tbl tr:last-child td{border-bottom:0}
.req{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:6px;background:#3a2a20;border:1.5px solid var(--acc);animation:rq 2.4s ease-out infinite}.req.ok{background:#1F3A2E;border-color:#3f7a5f;animation:none}
@keyframes rq{0%{box-shadow:0 0 0 0 rgba(228,106,43,.55)}70%{box-shadow:0 0 0 14px rgba(228,106,43,0)}100%{box-shadow:0 0 0 0 rgba(228,106,43,0)}}
.chipreq{align-self:flex-start;font-size:11px;letter-spacing:1.6px;font-weight:500;padding:4px 9px;border-radius:999px;background:var(--acc);color:#fff}.req.ok .chipreq{background:#3f7a5f}
.rwrap{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:8px;border:1.5px solid var(--acc)}.rwrap.ok{border-color:#3f7a5f}
.tag{font-size:11px;letter-spacing:.8px;padding:4px 8px;border-radius:999px;background:var(--acc);color:#fff}
.big{font-size:84px;line-height:1;font-weight:200;letter-spacing:2px;font-variant-numeric:tabular-nums}
.pill.now{background:var(--acc);color:#fff}.pill.nx{color:#8f8c87;border-color:#555}
</style>
</head>

'<button class="btn" data-a="'+(all?'fin':'mesas')+'">'+(all?'Finalizar encuentro':'Ir a mi siguiente mesa')+'</button>'},
adminlogin:function(){return '<div class="k">ADMINISTRACIÓN</div><h2>Acceso<br><span>restringido.</span></h2><p style="font-size:14px">Ingresa la contraseña para ver los registrados y el reporte por mesa.</p><div class="field"><label for="f-pw">Contraseña</label><input class="in" id="f-pw" type="password" autocomplete="current-password" data-f="pw" value=""></div>'+(S.admErr?'<div class="err">'+esc(S.admErr)+'</div>':'')+'<button class="btn" data-a="admin"'+(S.admBusy?' disabled':'')+'>'+(S.admBusy?'Verificando…':'Entrar')+'</button><button class="link" data-a="admexit">Volver al inicio</button>'},
admin:function(){var B=admBuild(S.admData||{});
var regRows=B.regs.length?B.regs.map(function(x){var r=x.r;return '<tr><td>'+esc(fdia(r.fecha))+'</td><td>'+esc(r.nombre)+'</td><td>'+esc(r.empresa)+'</td><td>'+esc(waFmt(r.whatsapp))+'</td><td>'+esc(r.orden_mesas)+'</td><td>'+esc(x.mesas||'—')+'</td></tr>'}).join(''):'<tr><td colspan="6" style="color:var(--mut)">Aún no hay registros.</td></tr>';
return '<div class="k">ADMINISTRACIÓN · PR OPEN</div><h2>Registrados<br><span>y reporte por mesa.</span></h2>'+
(API_URL?'':'<div class="note">Modo local: solo se ven los registros hechos en este dispositivo. Conecta la base de datos (API_URL) para ver los de todos los asistentes.</div>')+
(S.admErr?'<div class="err">'+esc(S.admErr)+'</div>':'')+
'<div class="stats"><div><b>'+B.reg.length+'</b><span>Registrados</span></div>'+B.mesas.map(function(x){return '<div><b>'+x.rows.length+'</b><span>En mesa '+x.m.n+'</span></div>'}).join('')+'</div>'+
'<div class="chips"><button class="btn sm" style="width:auto" data-a="csvreg">Descargar registrados (.csv)</button><button class="btn sm" style="width:auto" data-a="csvmesa">Descargar reporte por mesa (.csv)</button><button class="btn ghost sm" style="width:auto" data-a="admrefresh">'+(S.admBusy?'Actualizando…':'Actualizar')+'</button><button class="btn ghost sm" style="width:auto" data-a="admexit">Cerrar sesión</button></div>'+
'<div class="sec">BASE DE DATOS DE REGISTRADOS</div><div class="scroll"><table class="tbl"><thead><tr><th>FECHA</th><th>NOMBRE</th><th>EMPRESA</th><th>WHATSAPP</th><th>ORDEN ASIGNADO</th><th>ASISTIÓ A</th></tr></thead><tbody>'+regRows+'</tbody></table></div>'+
B.mesas.map(function(x){var rows=x.rows.length?x.rows.map(function(r){return '<tr><td>'+esc(r.nombre)+'</td><td>'+esc(r.empresa)+'</td><td>'+esc(waFmt(r.wa))+'</td><td>'+esc(hhmm(r.hora))+'</td><td>'+(r.graba?'Sí':'—')+'</td><td>'+(r.envio?'Sí':'—')+'</td></tr>'}).join(''):'<tr><td colspan="6" style="color:var(--mut)">Nadie ha marcado asistencia en esta mesa.</td></tr>';
return '<div class="sec">MESA '+x.m.n+' · '+x.m.t.toUpperCase()+'</div><p style="font-size:14px">Responsable de la grabación: <b style="font-weight:400;color:var(--ink)">'+(x.top?esc(x.top.n):'—')+'</b></p><div class="scroll"><table class="tbl"><thead><tr><th>PARTICIPANTE</th><th>EMPRESA</th><th>WHATSAPP</th><th>LLEGADA</th><th>GRABA</th><th>NOTA ENVIADA</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}).join('')+
'<button class="link" data-a="admexit">Volver al inicio</button>'},
fin:function(){return '<div class="k">PR OPEN · CIERRE</div><h2 style="font-size:34px;line-height:1.05">Tres mesas.<br><span>Tu experiencia sumó.</span></h2><p>Tienes en tu WhatsApp las tres ligas con resúmenes, conclusiones, acciones clave y mapas de ideas.</p><div class="list">'+
MESAS.map(function(m,i){return '<button class="row" style="background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;cursor:pointer;align-items:center" data-a="view" data-i="'+i+'"><span class="num" style="font-size:20px">'+m.n+'</span><span style="flex:1;font-size:15px">'+m.t+'</span>'+ic.chev+'</button>'}).join('')+
'</div><div class="n3card"><img src="'+LOGO+'" alt="N3 Thinktech IA Laboratory" style="width:150px;height:auto"><div style="font-size:20px;line-height:1.25">¿Quieres una IA así para tu agencia?</div><div style="font-size:14px;line-height:1.5;color:var(--mut)">Este sistema es un desarrollo de IA de N3 Labs. Creamos agentes, asistentes y herramientas a la medida.</div><a class="btn" style="background:#25D366;color:#0B2E1A;min-height:50px;font-size:15px;font-weight:500" href="'+WA_URL+'" target="_blank" rel="noopener">'+ic.wa.replace('#25D366','#0B2E1A')+'Contactar a N3 Labs por WhatsApp</a><a href="https://n3labs.potenttial.site/" target="_blank" rel="noopener" style="font-size:13px;color:var(--mut);text-align:center">Conocer más en n3labs.potenttial.site</a></div>'}
};
function render(){document.querySelector('.app').style.maxWidth=(S.step==='admin')?'1040px':'';$m.innerHTML=V[S.step]()}
var timer=null;
function proc(){set({step:'proc',proc:0});clearTimeout(timer);(function tick(){timer=setTimeout(function(){var p=S.proc+1;if(p>=STEPS.length){var d=S.done.slice();d[S.mesa]=true;set({done:d,view:S.mesa,hi:null,step:'result'})}else{S.proc=p;render();tick()}},1000)})()}
$m.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,i=b.dataset.i;
if(a==='reg')set({step:'registro'});
else if(a==='enter'){if(regOk())assign()}
else if(a==='start'){stopRec();set({step:'jefe',mesa:+i,jefe:null,audioUrl:'',demoAudio:false,sec:0,err:'',peers:[]});track({tipo:'checkin',mesa:MESAS[+i].n});pollPeers()}
else if(a==='view')set({step:'result',view:+i,hi:null});
else if(a==='mesas'){stopPeers();set({step:'mesas'})}
else if(a==='pick'){S.jefe=i;render()}
else if(a==='cjefe'){if(S.jefe){var pp=people().filter(function(p){return p[0]===S.jefe})[0];track({tipo:'vote',mesa:MESAS[S.mesa].n,recorder_id:S.jefe,recorder_nombre:pp?String(pp[1]).replace(' (tú)',''):''});stopPeers();set({step:'grabar'})}}
else if(a==='rec'){if(S.rec)stopRec();else startRec()}
else if(a==='demo'){set2({demoAudio:true,err:'',sec:1080})}
else if(a==='send'){track({tipo:'sent',mesa:MESAS[S.mesa].n});proc()}
else if(a==='hi'){S.hi=(S.hi===+i)?null:+i;render()}
else if(a==='fin')set({step:'fin'});
else if(a==='admin')adminLogin();
else if(a==='admrefresh')admLoad(S.admPw);
else if(a==='csvreg')csvReg();
else if(a==='csvmesa')csvMesa();
else if(a==='admexit'){history.replaceState(null,'',location.pathname+location.search);var pv=S.prev;if(['grabar','jefe','proc','asigna','admin','adminlogin'].indexOf(pv)>=0)pv=S.id?'mesas':'welcome';set({step:pv,admData:null,admPw:'',pw:'',admErr:''})}});
$m.addEventListener('input',function(e){var f=e.target.dataset.f;if(!f)return;S[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;var rb=document.getElementById('regbtn');if(rb)rb.disabled=!regOk()});
$m.addEventListener('change',function(e){if(e.target.dataset.f==='consent'){S.consent=e.target.checked;var rb=document.getElementById('regbtn');if(rb)rb.disabled=!regOk()}});
$m.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='f-pw'){e.preventDefault();adminLogin()}});
function chkHash(){if(location.hash==='#admin'&&S.step!=='admin'&&S.step!=='adminlogin'){S.prev=S.step;stopRec();set({step:'adminlogin',pw:'',admErr:''})}}
window.addEventListener('hashchange',chkHash);
render();chkHash();
</script>
